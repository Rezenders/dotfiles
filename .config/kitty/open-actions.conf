# Open scp-style Git remotes in the default browser; strip an optional .git.
# Pass the URL as an argument, never as shell source.
url ^git@[A-Za-z0-9][A-Za-z0-9.-]*:[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$
action launch --type=background sh -c 'remote=${1#git@}; host=${remote%%:*}; path=${remote#*:}; exec xdg-open "https://${host}/${path%.git}"' sh ${URL}

# Open any file with a fragment in vim, fragments are generated
# by ripgrep or the hyperlinked-grep kitten.
protocol file
fragment_matches [0-9]+
action launch --type=overlay --cwd=current nvim +${FRAGMENT} -- ${FILE_PATH}

# Open text files without fragments in the editor
protocol file
mime text/*
action launch --type=overlay --cwd=current -- ${EDITOR} -- ${FILE_PATH}
