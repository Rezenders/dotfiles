# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{

font_family      family="Hack Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

#: }}}

#: Text cursor customization {{{
cursor_shape underline
cursor_trail 0
cursor none
#: }}}

#: Scrollback {{{
scrollback_lines 25000

# Use kitty-scrollback.nvim for searchable scrollback and command output.
# Keep the pager as a fallback for actions that explicitly use show_scrollback.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
action_alias kitty_scrollback_nvim kitten /home/gus/.local/share/nvim/site/pack/core/opt/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+s kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map kitty_mod+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
#: }}}

#: Mouse {{{

copy_on_select yes
mouse_hide_wait -3.0

strip_trailing_spaces smart

# Detect scp-style Git remotes, including nested GitLab groups.
detect_url_regex git@[[:alnum:]][[:alnum:].-]*:[[:alnum:]_.-]+(/[[:alnum:]_.-]+)+
#: }}}

#: Window layout {{{

remember_window_size  yes

# Enable split panes as the default layout
# enabled_layouts splits,tall,stack
enabled_layouts splits,tall,stack

window_padding_width 1
window_margin_width 0
window_border_width 1.0pt

placement_strategy center
#: }}}

#: Tab bar {{{

# fade, slant, separator, powerline (slanted, angled, round), custom
tab_bar_style                   custom
tab_separator                   ""
# REF: https://github.com/kovidgoyal/kitty/discussions/4447
tab_title_template              "{fmt.bg.default}  {index}:{f'{title[:6]}…{title[-6:]}' if len(title) > 25 else title}{' [󰌨]' if layout_name == 'stack' else ''} "
active_tab_title_template       "{fmt.bg.default}  {index}:{f'{title[:6]}…{title[-6:]}' if len(title) > 25 else title}{' [󰌨]' if layout_name == 'stack' else ''} "
tab_bar_edge                    top
tab_bar_align                   left
tab_bar_margin_width            1.0
tab_bar_margin_height           2.0 0.0
active_tab_font_style           bold-italic
inactive_tab_font_style         normal
tab_bar_min_tabs                1
tab_activity_symbol             none
bell_on_tab                     " "

#: }}}

#: Color scheme {{{
background_opacity 0.92

# Configurations to make light themes better

# 1. Thicken light-mode font rendering (gamma & contrast adjustment)
# Linux default is 1.0 0, macOS is 1.7 30.
# For light backgrounds, boost the first value (gamma) to make black text bolder.
text_composition_strategy 1.4 30

# 2. Prevent ANSI / TUI applications from rendering illegible low-contrast text
# Automatically force dark text when luminance differences fail contrast checks
# From kitty's documentation: "A value with the suffix ratio represents the
# minimum accepted contrast ratio between the foreground and background color.
# Possible values range from 0.0 ratio to 21.0 ratio. For example, to meet WCAG
# level AA a value of 4.5 ratio can be provided."
text_fg_override_threshold 4.5ratio

## END configurations to make light themes better
#: }}}

#: Advanced {{{

allow_remote_control yes
listen_on unix:/tmp/mykitty

shell_integration enabled

notify_on_cmd_finish invisible 30
enable_audio_bell no
#: }}}

#: Tab management {{{
map kitty_mod+] next_tab
map kitty_mod+l next_tab
map kitty_mod+[ previous_tab
map kitty_mod+h previous_tab

map --allow-fallback=shifted,ascii shift+cmd+i set_tab_title

map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
#: }}}

#: Layout management {{{

# Split panes
map kitty_mod+e launch --location=vsplit --cwd=current
map kitty_mod+o launch --location=hsplit --cwd=current

# Navigation between Kitty panes
map ctrl+h neighboring_window left
map ctrl+j neighboring_window bottom
map ctrl+k neighboring_window top
map ctrl+l neighboring_window right

# Forward navigation shortcuts to Neovim when focused
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

# Close current pane
map kitty_mod+d close_window

# Zoom current pane full-screen and back (hides the other panes)
map kitty_mod+m toggle_layout stack
map kitty_mod+space next_layout

# Open URL using keyboard hints
map kitty_mod+f open_url_with_hints

map kitty_mod+p>i kitten hints --type=ip --program -
# Ctrl+Shift+P, then G: open an scp-style Git remote using keyboard hints.
map kitty_mod+p>g kitten hints --type=regex --regex 'git@[A-Za-z0-9][A-Za-z0-9.-]*:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+' --customize-processing git_remote_hints.py

# Copy hints to the system clipboard (@), without pasting or opening them.
map kitty_mod+y>u kitten hints --type=url --program @
map kitty_mod+y>f kitten hints --type=path --program @
map kitty_mod+y>l kitten hints --type=line --program @
map kitty_mod+y>w kitten hints --type=word --program @
map kitty_mod+y>h kitten hints --type=hash --program @
map kitty_mod+y>y kitten hints --type=hyperlink --program @
map kitty_mod+y>i kitten hints --type=ip --program @
# Explicit template copies path:line, rather than an editor command.
map kitty_mod+y>n kitten hints --type=linenum --linenum-action=self --program @ '{path}:{line}'
# Regex mode defaults to trimmed lines; replace --regex to customize matching.
map kitty_mod+y>r kitten hints --type=regex --program @
# Copy the original Git remote; omit the browser-opening custom handler.
map kitty_mod+y>g kitten hints --type=regex --regex 'git@[A-Za-z0-9][A-Za-z0-9.-]*:[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+' --program @

#: }}}

#: Miscellaneous {{{

map shift+cmd+/ open_url https://sw.kovidgoyal.net/kitty/

#: }}}


