# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{

font_family      family="Hack Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

#: }}}

#: Text cursor customization {{{
cursor_shape underline
cursor_trail 0
cursor none
#: }}}

#: Scrollback {{{
scrollback_lines 25000

# Use kitty-scrollback.nvim for searchable scrollback and command output.
# Keep the pager as a fallback for actions that explicitly use show_scrollback.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
action_alias kitty_scrollback_nvim kitten /home/gus/.local/share/nvim/site/pack/core/opt/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
#: }}}

#: Mouse {{{

copy_on_select yes
mouse_hide_wait -3.0

# open_url_with default

#: The program to open clicked URLs. The special value default will
#: first look for any URL handlers defined via the open_actions
#: <https://sw.kovidgoyal.net/kitty/open_actions/> facility and if non
#: are found, it will use the Operating System's default URL handler
#: (open on macOS and xdg-open on Linux).

# url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

#: The set of URL prefixes to look for when detecting a URL under the
#: mouse cursor.

# detect_url_regex

#: A regular expression to detect as a URL under the mouse, in
#: addition to the URLs detected via url_prefixes. Can be specified
#: multiple times, text under the mouse is detected as a URL if any of
#: the expressions match it. The expressions are tried in the order
#: specified, and only if no normal URL is found under the mouse.
#: Matches are highlighted and clickable exactly like normal detected
#: URLs, see detect_urls. The expressions use the POSIX extended
#: regular expression syntax, so use [0-9] rather than \d and
#: [[:alnum:]] rather than \w. Text that has been soft wrapped onto
#: multiple lines is matched as a single line, looking at most three
#: lines above and below the mouse. For example, to detect file
#: references of the form path/to/file.py:42::

#:     detect_url_regex [[:alnum:]_./-]+\.[[:alnum:]]+:[0-9]+

#: The matched text is used as the URL when clicked. Use open_actions
#: <https://sw.kovidgoyal.net/kitty/open_actions/> with the url
#: criterion to specify what to do with it. Note that the url
#: criterion uses Python regular expression syntax. For example, to
#: pass file references to a script of your own that opens them in an
#: editor, add to open-actions.conf::

#:     url ^[\w./-]+\.\w+:\d+$
#:     action launch --type=background open-file-ref ${URL}

#: }}}

#: Window layout {{{

remember_window_size  yes

# Enable split panes as the default layout
# enabled_layouts splits,tall,stack
enabled_layouts splits,tall,stack,fat,grid,horizontal

hide_window_decorations titlebar-only

window_padding_width 0
window_margin_width 0
window_border_width 1.0pt

placement_strategy center
#: }}}

#: Tab bar {{{

# fade, slant, separator, powerline (slanted, angled, round), custom
tab_bar_style                   custom
# REF: https://github.com/kovidgoyal/kitty/discussions/4447
tab_title_template              "{fmt.bg.default}  {index}:{f'{title[:6]}…{title[-6:]}' if len(title) > 25 else title}{' [󰌨]' if layout_name == 'stack' else ''} "
active_tab_title_template       "{fmt.bg.default}  {index}:{f'{title[:6]}…{title[-6:]}' if len(title) > 25 else title}{' [󰌨]' if layout_name == 'stack' else ''} "
tab_bar_edge                    top
tab_bar_align                   left
tab_bar_margin_width            0.0
tab_bar_margin_height           4.0 0.0
active_tab_font_style           bold-italic
inactive_tab_font_style         normal
tab_bar_min_tabs                1
tab_activity_symbol             none
bell_on_tab                     " "

#: }}}

#: Color scheme {{{
background_opacity 0.92

# Configurations to make light themes better

# 1. Thicken light-mode font rendering (gamma & contrast adjustment)
# Linux default is 1.0 0, macOS is 1.7 30.
# For light backgrounds, boost the first value (gamma) to make black text bolder.
text_composition_strategy 1.4 30

# 2. Prevent ANSI / TUI applications from rendering illegible low-contrast text
# Automatically force dark text when luminance differences fail contrast checks
# From kitty's documentation: "A value with the suffix ratio represents the
# minimum accepted contrast ratio between the foreground and background color.
# Possible values range from 0.0 ratio to 21.0 ratio. For example, to meet WCAG
# level AA a value of 4.5 ratio can be provided."
text_fg_override_threshold 4.5ratio

## END configurations to make light themes better
#: }}}

#: Advanced {{{

allow_remote_control yes
listen_on unix:/tmp/mykitty

shell_integration enabled

notify_on_cmd_finish invisible 30
enable_audio_bell no
#: }}}

#: Tab management {{{
map shift+cmd+] next_tab
map shift+cmd+[ previous_tab
map --allow-fallback=shifted,ascii shift+cmd+i set_tab_title
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
#: }}}

#: Layout management {{{

# Split panes
map ctrl+shift+e launch --location=vsplit --cwd=current
map ctrl+shift+o launch --location=hsplit --cwd=current

# Navigation between Kitty panes
map ctrl+h neighboring_window left
map ctrl+j neighboring_window bottom
map ctrl+k neighboring_window top
map ctrl+l neighboring_window right

# Forward navigation shortcuts to Neovim when focused
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

# Close current pane
map ctrl+shift+d close_window

# Zoom current pane full-screen and back (hides the other panes)
map ctrl+shift+m toggle_layout stack

# Open URL using keyboard hints
map ctrl+shift+f open_url_with_hints
#: }}}

#: Miscellaneous {{{

map shift+cmd+/ open_url https://sw.kovidgoyal.net/kitty/

#: }}}


