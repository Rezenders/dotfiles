# map f2 launch --type=window-dock --dock-edge=right --dock-size=25% --cwd=current pi
# map f3 launch --type=window-dock --dock-edge=right --dock-size=25% --cwd=current /home/gus/.config/kitty/claude-ide.py

# Machine-specific theme (personal = Kanagawa, work = Gruvbox). The *-theme.auto.conf
# files pick dark/light from the desktop setting; this is the fallback. See themes/.
geninclude themes/dark.py


