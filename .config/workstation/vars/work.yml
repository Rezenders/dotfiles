---
# Work workstation configuration (Kubuntu 24.04)

ansible_become_exe: /usr/bin/sudo

install_latex: false
enable_syncthing: false
enable_tide_cfg_hook: true

desktop_packages:
  - kitty
  - input-remapper

personal_apt_packages:
  - spotify-client

vendor_installers:
  - name: Zed
    url: https://zed.dev/install.sh
    script: zed-install.sh
    interpreter: /bin/sh
    executable: "{{ workstation_home }}/.local/bin/zed"

pi_packages:
  - git:github.com/code-yeongyu/pi-ast-grep
  - npm:pi-web-access
  - git:github.com/samfoy/pi-lsp-extension
  - npm:pi-subagents
  - ../../git/pi-nvim
