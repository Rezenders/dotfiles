---
- name: Check whether Betterleaks is installed
  ansible.builtin.stat:
    path: "{{ workstation_home }}/.local/bin/betterleaks"
  register: betterleaks_binary

- name: Check Betterleaks version if installed
  ansible.builtin.command:
    argv:
      - "{{ workstation_home }}/.local/bin/betterleaks"
      - version
  register: betterleaks_current_version
  when: betterleaks_binary.stat.exists
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download and install Betterleaks as the normal user
  when:
    - not betterleaks_binary.stat.exists or (betterleaks_current_version.stdout | default('') | trim != betterleaks_version)
    - not ansible_check_mode
  block:
    - name: Create user-owned installer and bin directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ workstation_home }}/.cache/workstation/installers"
        - "{{ workstation_home }}/.local/bin"

    - name: Download Betterleaks archive
      ansible.builtin.get_url:
        url: "https://github.com/betterleaks/betterleaks/releases/download/v{{ betterleaks_version }}/betterleaks_{{ betterleaks_version }}_linux_x64.tar.gz"
        dest: "{{ workstation_home }}/.cache/workstation/installers/betterleaks_{{ betterleaks_version }}_linux_x64.tar.gz"
        checksum: "{{ betterleaks_checksum }}"
        mode: "0600"

    - name: Extract Betterleaks binary to ~/.local/bin
      ansible.builtin.unarchive:
        src: "{{ workstation_home }}/.cache/workstation/installers/betterleaks_{{ betterleaks_version }}_linux_x64.tar.gz"
        dest: "{{ workstation_home }}/.local/bin"
        include:
          - betterleaks
        mode: "0755"
        remote_src: true

- name: Configure user-global Betterleaks pre-commit hook
  when: enable_global_git_hook | default(true) | bool
  block:
    - name: Ensure user-global hooks directory exists
      ansible.builtin.file:
        path: "{{ workstation_home }}/.config/git/hooks"
        state: directory
        mode: "0755"

    - name: Check for existing global pre-commit hook
      ansible.builtin.stat:
        path: "{{ workstation_home }}/.config/git/hooks/pre-commit"
      register: global_hook_stat

    - name: Read existing global pre-commit hook if present
      ansible.builtin.slurp:
        src: "{{ workstation_home }}/.config/git/hooks/pre-commit"
      register: global_existing_hook
      when: global_hook_stat.stat.exists

    - name: Verify existing global pre-commit hook is managed
      ansible.builtin.assert:
        that:
          - "'# Managed by Ansible (~/.config/workstation)' in (global_existing_hook.content | b64decode)"
          - "'betterleaks' in (global_existing_hook.content | b64decode)"
        fail_msg: >-
          An unmanaged pre-commit hook exists at {{ workstation_home }}/.config/git/hooks/pre-commit.
          To prevent losing existing hook functionality, inspect and merge it manually.
      when: global_hook_stat.stat.exists

    - name: Install user-global Betterleaks pre-commit hook
      ansible.builtin.copy:
        dest: "{{ workstation_home }}/.config/git/hooks/pre-commit"
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by Ansible (~/.config/workstation)
          set -e

          if command -v betterleaks >/dev/null 2>&1; then
              BETTERLEAKS="betterleaks"
          elif [ -x "$HOME/.local/bin/betterleaks" ]; then
              BETTERLEAKS="$HOME/.local/bin/betterleaks"
          else
              echo "Error: betterleaks is not installed or not in PATH / \$HOME/.local/bin" >&2
              echo "Run Ansible to install Betterleaks: ansible-playbook ~/.config/workstation/workstation.yml" >&2
              exit 1
          fi

          exec "$BETTERLEAKS" git --pre-commit --staged --redact -v

    # Append after existing includes so they cannot override the managed path.
    # Git permits repeated sections; unrelated settings remain untouched.
    - name: Set user-global Git hooks path
      ansible.builtin.blockinfile:
        path: "{{ workstation_home }}/.gitconfig"
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BETTERLEAKS HOOKS"
        insertafter: EOF
        block: |
          [core]
              hooksPath = "{{ workstation_home }}/.config/git/hooks"

    - name: Verify effective user hooks path including included config
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - config
          - --file
          - "{{ workstation_home }}/.gitconfig"
          - --includes
          - --get
          - core.hooksPath
      register: global_hooks_path
      changed_when: false
      failed_when: >-
        global_hooks_path.rc != 0 or
        global_hooks_path.stdout != workstation_home ~ '/.config/git/hooks'
      when: not ansible_check_mode
